<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Patient Details - Hospital Management System
    </title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


    <header
        class="app-header"
        id="appHeader"
    >
    </header>


    <div class="app-layout">


        <aside
            class="sidebar"
            id="sidebar"
        >
        </aside>


        <main class="main-content">

            <h2>
                Patient Details
            </h2>


            <div id="patientDetails">

                Loading patient...

            </div>


            <p id="patientDetailsMessage"></p>

            <!--
                Patient actions.
            -->
            <div id="patientActions">

                <a href="#" id="editPatientButton">
                    Edit Patient
                </a>


                <a href="#" id="createBillButton">
                    Create Bill
                </a>


                <button
                    type="button"
                    id="deletePatientButton"
                >
                    Delete Patient
                </button>

            </div>




        </main>

    </div>


    <footer
        class="app-footer"
        id="appFooter"
    >
    </footer>


    <script src="js/session.js"></script>

    <script src="js/dashboard.js"></script>

    <script src="js/patient-data.js"></script>

    <script src="js/patient-details.js"></script>

    <script src="js/delete-patient.js"></script>

    <script src="js/app-shell.js"></script>


</body>

</html>
