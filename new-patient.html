<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        New Patient - Hospital Management System
    </title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


    <header
        class="app-header"
        id="appHeader"
    >
    </header>


    <div class="app-layout">

        <aside
            class="sidebar"
            id="sidebar"
        >
        </aside>


        <main class="main-content">

            <h2>
                New Patient
            </h2>


            <form id="patientForm">


                <h3>
                    Patient Information
                </h3>


                <!--
                    Patient ID is generated by the system.
                -->
                <div class="form-group">

                    <label for="patientId">
                        Patient ID
                    </label>

                    <input
                        type="text"
                        id="patientId"
                        readonly
                    >

                </div>


                <div class="form-group">

                    <label for="ssn">
                        SSN *
                    </label>

                    <input
                        type="text"
                        id="ssn"
                        maxlength="20"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="firstName">
                        First Name *
                    </label>

                    <input
                        type="text"
                        id="firstName"
                        maxlength="50"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="lastName">
                        Last Name *
                    </label>

                    <input
                        type="text"
                        id="lastName"
                        maxlength="50"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="dob">
                        Date of Birth *
                    </label>

                    <input
                        type="date"
                        id="dob"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="gender">
                        Gender *
                    </label>

                    <select
                        id="gender"
                        required
                    >

                        <option value="">
                            Select Gender
                        </option>

                        <option value="Male">
                            Male
                        </option>

                        <option value="Female">
                            Female
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="bloodGroup">
                        Blood Group
                    </label>

                    <select id="bloodGroup">

                        <option value="">
                            Select Blood Group
                        </option>

                        <option value="A+">A+</option>
                        <option value="A-">A-</option>
                        <option value="B+">B+</option>
                        <option value="B-">B-</option>
                        <option value="AB+">AB+</option>
                        <option value="AB-">AB-</option>
                        <option value="O+">O+</option>
                        <option value="O-">O-</option>

                    </select>

                </div>


                <h3>
                    Physical Information
                </h3>


                <div class="form-group">

                    <label for="height">
                        Height (cm)
                    </label>

                    <input
                        type="number"
                        id="height"
                        min="0"
                        step="0.1"
                    >

                </div>


                <div class="form-group">

                    <label for="weight">
                        Weight (kg)
                    </label>

                    <input
                        type="number"
                        id="weight"
                        min="0"
                        step="0.1"
                    >

                </div>


                <h3>
                    Contact Information
                </h3>


                <div class="form-group">

                    <label for="mobile">
                        Mobile *
                    </label>

                    <input
                        type="tel"
                        id="mobile"
                        maxlength="15"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        maxlength="100"
                    >

                </div>


                <div class="form-group">

                    <label for="address">
                        Address *
                    </label>

                    <textarea
                        id="address"
                        maxlength="200"
                        required
                    ></textarea>

                </div>


                <div class="form-group">

                    <label for="city">
                        City *
                    </label>

                    <input
                        type="text"
                        id="city"
                        maxlength="50"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="state">
                        State *
                    </label>

                    <input
                        type="text"
                        id="state"
                        maxlength="50"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="pin">
                        PIN *
                    </label>

                    <input
                        type="text"
                        id="pin"
                        maxlength="10"
                        required
                    >

                </div>


                <h3>
                    Emergency Contact
                </h3>


                <div class="form-group">

                    <label for="emergencyName">
                        Emergency Contact Name *
                    </label>

                    <input
                        type="text"
                        id="emergencyName"
                        maxlength="100"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="emergencyRelationship">
                        Relationship *
                    </label>

                    <input
                        type="text"
                        id="emergencyRelationship"
                        maxlength="50"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="emergencyMobile">
                        Emergency Mobile *
                    </label>

                    <input
                        type="tel"
                        id="emergencyMobile"
                        maxlength="15"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="primary-button"
                >
                    Create Patient
                </button>


                <button
                    type="reset"
                >
                    Clear
                </button>


                <p
                    id="patientMessage"
                ></p>


            </form>

        </main>

    

    </div>


    <footer
        class="app-footer"
        id="appFooter"
    >
    </footer>


    <script src="js/session.js"></script>

    <script src="js/dashboard.js"></script>

    <script src="js/validation.js"></script>

    <script src="js/patient-data.js"></script>

    <script src="js/patient-form.js"></script>

    <script src="js/app-shell.js"></script>


</body>

</html>
